<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Registro de cambios de posición detectados o registrados por el cuidador." />
  <title>Posiciones · Monitoreo de Colchón Inteligente</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body data-view="positions">
  <div id="navbar-root"></div>

  <main id="view-root" class="view-root">
    <div class="page">
      <div class="page-header">
        <h1>Posiciones</h1>
        <p class="page-subtitle">Registro de cambios de postura detectados o registrados por el cuidador.</p>
      </div>

      <section class="card">
        <header class="card__header"><h2>Registrar cambio de posición</h2></header>
        <div class="card__body">
          <div id="positions-chips" class="chip-group"></div>
          <p class="muted">Registra manualmente un cambio de posición (se guarda con fuente «Cuidador»).</p>
        </div>
      </section>

      <section class="card">
        <header class="card__header"><h2>Historial de posiciones</h2></header>
        <div class="card__body">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Fecha y hora</th>
                  <th>Posición</th>
                  <th>Fuente</th>
                </tr>
              </thead>
              <tbody id="positions-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <noscript>
    <p class="noscript">Esta aplicación requiere JavaScript para funcionar. Habilítalo y recarga la página.</p>
  </noscript>

  <script type="module" src="js/app-shell.js"></script>
  <script type="module" src="js/page.js"></script>
</body>
</html>
